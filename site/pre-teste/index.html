    <h2>Termo de Consentimento Livre e Esclarecido</h2>
    <p class="subtitulo">Pré teste semântico e funcional do IDCGT AP</p>
    <p>CAAE 01258726.4.0000.5540. Parecer ético favorável: <strong data-parecer></strong>.</p>
    <p>Você está sendo convidado a participar da pesquisa Gestão por Competências em uma Instituição Científica Tecnológica e de Inovação: Desenvolvimento evidências de validade de conteúdo e aplicação do IDCGT AP na RBCIP, de responsabilidade de João Pedro de Lima Oliveira, estudante do Mestrado Profissional em Administração Pública da Universidade de Brasília, sob orientação de Prof. Dr. Thiago Gomes Nascimento.</p>

    <h3>Objetivo e procedimento</h3>
    <p>O pré-teste verificará a clareza das instruções, dos itens, das escalas, do consentimento e do funcionamento da página. Participarão cinco profissionais de perfil semelhante ao público-alvo e externos à população da RBCIP.</p>
    <p>Você preencherá o questionário de teste e responderá por escrito a perguntas sobre sua experiência. A atividade durará aproximadamente 20 a 30 minutos. Não haverá entrevista, gravação de voz, captura de imagem ou vídeo. Seus registros serão identificados apenas por código de P1 a P5 e não serão incorporados ao diagnóstico da RBCIP.</p>

    <h3>Voluntariedade e riscos</h3>
    <p>A participação é voluntária. Você poderá recusar, deixar perguntas sem resposta ou interromper antes do envio, sem prejuízo. Os riscos são cansaço, desconforto ao avaliar o formulário e risco residual de privacidade no ambiente virtual. Os comentários serão apresentados sem identificação e qualquer informação capaz de reconhecer pessoas ou organizações será generalizada ou omitida.</p>

    <h3>Plataforma armazenamento e exclusão</h3>
    <p>A interface será hospedada no GitHub Pages; as respostas serão transmitidas por Google Apps Script e armazenadas temporariamente em Google Sheets. Não será exigido login e o código não gravará nome, e-mail, IP, geolocalização, identificador do dispositivo ou carimbo de data e hora no banco analítico.</p>
    <p>Os fornecedores poderão processar dados técnicos segundo suas políticas. Encerrado o pré-teste, os registros serão exportados para arquivo local protegido e apagados dos ambientes em nuvem controlados pelo pesquisador.</p>

    <h3>Benefícios ressarcimento e assistência</h3>
    <p>Não há benefício direto nem pagamento. Sua colaboração poderá tornar o instrumento mais claro e funcional. Não são previstas despesas obrigatórias; eventual gasto diretamente decorrente da participação será ressarcido mediante solicitação e comprovação. Permanecem assegurados assistência e indenização por dano diretamente relacionado à pesquisa, nos termos aplicáveis.</p>

    <h3>Cópia retirada e contatos</h3>
    <p>Antes de decidir, utilize o botão Baixar TCLE em PDF. Você poderá interromper antes do envio. Depois do envio, a ausência de identificadores poderá impedir a localização e exclusão de uma resposta específica.</p>
    <p>Pesquisador: João Pedro de Lima Oliveira; (86) 99946-8030; jploliveira19@gmail.com e joaopedro@rbcip.org. CEP CHS UnB: cep_chs@unb.br; (61) 3107-1592.</p>
